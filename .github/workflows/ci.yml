name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # setup-python no longer ships 3.9 for current Ubuntu images; 3.9 is covered below with
        # the macOS system interpreter, which is what most users of these skills actually run.
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Helper copies in sync
        run: python tools/sync_common.py --check
      - name: Validate skills (Agent Skills format)
        run: python tools/validate_skills.py
      - name: Unit + MCP end-to-end tests
        run: python -m unittest discover -s tests -v
      - name: Installer smoke test
        run: |
          ./install.sh --dest "$RUNNER_TEMP/skills"
          test -f "$RUNNER_TEMP/skills/swiftui-state-layout/SKILL.md"
      - name: MCP server starts (macOS tools may be unavailable on Linux)
        run: python mcp-server/server.py --call xcode_environment

  macos-system-python:
    name: macos-latest / system python3 (3.9)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Interpreter
        run: /usr/bin/python3 --version
      - name: Validate skills
        run: /usr/bin/python3 tools/validate_skills.py
      - name: Unit + MCP end-to-end tests
        run: /usr/bin/python3 -m unittest discover -s tests -v

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh skills/*/assets/*.sh
